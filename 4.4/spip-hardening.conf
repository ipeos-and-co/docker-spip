# Coupe le moteur PHP dans les deux repertoires ou le serveur web depose des contenus.
#
# La regle livree par SPIP dans htaccess.txt ne couvre que l'extension .php. Une
# directive php_admin_* posee ici s'applique quelle que soit l'extension et n'est pas
# surchargeable depuis un .htaccess.
#
# AllowOverride n'est pas modifie : les .htaccess conservent tous leurs pouvoirs, a la
# racine comme dans IMG/<extension>/.

<Directory /var/www/html/IMG>
    php_admin_flag engine off
</Directory>

<Directory /var/www/html/local>
    php_admin_flag engine off
</Directory>
